<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opening Builder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9/assets/chessground.base.css">
<style id="boardcss"></style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9/assets/chessground.cburnett.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
:root{--bg:#f7f6f5;--fg:#4d4d4d;--card:#fff;--bd:#d9d9d9;--ac:#629924;--mut:#8a8a8a}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#bababa;--card:#262421;--bd:#3c3a37;--ac:#629924;--mut:#8a8784}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px "Noto Sans",system-ui,sans-serif}
header{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bd)}
header h1{font-size:17px;margin:0 auto 0 0}
main{display:flex;gap:16px;flex-wrap:wrap;padding:16px;max-width:1100px;margin:auto}
#left{flex:1 1 360px;max-width:560px}aside{flex:1 1 320px;display:flex;flex-direction:column;gap:12px}
#board{width:100%;aspect-ratio:1/1}
#pathline{margin-top:8px;color:var(--mut);font-size:13px;min-height:2.6em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px}
button,select,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:500;color:var(--mut);font-size:12px}
td,th{padding:4px 6px}tr[data-mv]{cursor:pointer}tr[data-mv]:hover{background:rgba(120,120,120,.15)}
.mut{color:var(--mut);font-size:13px}
#moves{max-height:55vh;overflow:auto}summary{cursor:pointer}label{display:inline-block;margin:2px 8px 2px 0}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#b3261e;color:#fff;padding:8px 14px;border-radius:6px;display:none;max-width:90vw}
#gate{display:none;justify-content:center;padding:48px 16px}.out #gate{display:flex}
#gate .card{max-width:420px;text-align:center}#gate h2{margin-top:0}#gate button{padding:10px 18px;font-weight:700}
#boardwrap{position:relative;container-type:inline-size}
#promo{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#promo.show{display:flex}#promo .pbox{display:flex;gap:4px;padding:6px;background:var(--card);border-radius:8px}
#promo button{position:relative;width:min(16vw,84px);aspect-ratio:1;padding:0}
#promo piece{position:absolute;inset:0;width:100%;height:100%;display:block}
#ranks,#files{position:absolute;display:flex;pointer-events:none;font-size:max(9px,2.2cqw);font-weight:700;line-height:1;z-index:3}
#ranks{top:0;right:0;height:100%;flex-direction:column}
#ranks span{flex:1;padding:.3em .35em 0 0;text-align:right}
#files{bottom:0;left:0;width:100%;align-items:flex-end}
#files span{flex:1;padding:0 0 .3em .35em;text-align:left}
#ranks .d,#files .d{color:#ecdab9}#ranks .l,#files .l{color:#8e7055}
.out main,.out header button{display:none}
.seg{display:inline-flex}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0;margin-left:-1px}
</style>
<script>try{if(!JSON.parse(localStorage.getItem('cfg')).token)throw 0}catch{document.documentElement.classList.add('out')}</script>
</head><body>
<header><h1>♞ Opening Builder</h1>
<span class="seg"><button id="colW" data-a="colW">♔ White</button><button id="colB" data-a="colB">♚ Black</button></span>
<button data-a="load">Load…</button><button data-a="save">Save</button><button id="auth" data-a="auth">Log in with Lichess</button>
<input type="file" id="file" accept=".json" hidden></header>
<section id="gate"><div class="card"><h2>♞ Opening Builder</h2>
<p>Build an opening tree around the positions that actually come up most often in Lichess games.</p>
<p id="gate-msg" class="mut">The opening explorer needs a free Lichess account, so please log in to continue. No special permissions are requested.</p>
<button data-a="auth" class="on">Log in with Lichess</button></div></section>
<main><section id="left"><div id="boardwrap"><div id="board"></div><div id="ranks"></div><div id="files"></div><div id="promo" class="cg-wrap"></div></div><div id="pathline"></div></section>
<aside><div class="card" id="info"></div><div class="card"><div class="btns" id="btns"></div></div>
<div class="card" id="moves"></div>
<details class="card"><summary>Settings</summary><div id="settings"></div></details></aside></main>
<div id="toast"></div>
<script type="module">
import {Chessground} from 'https://cdn.jsdelivr.net/npm/chessground@9/+esm';
const START_FEN='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const key=f=>f.split(' ').slice(0,3).join(' ');
const START=key(START_FEN);
const ALL_S=['ultraBullet','bullet','blitz','rapid','classical','correspondence'];
const ALL_R=['0','1000','1200','1400','1600','1800','2000','2200','2500'];
const $=s=>document.querySelector(s);
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch{return null}};
let cfg={token:'',speeds:['bullet','blitz','rapid','classical','correspondence'],ratings:['2200','2500']};
try{Object.assign(cfg,JSON.parse(ls('cfg')||'{}'))}catch{}
let S=null,busy=false;
function applyTheme(){const l='#ecdab9',d='#ae8a68';let q='';
  for(let r=0;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2)q+=`M${c} ${r}h1v1h-1z`;
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><path fill='${d}' d='${q}'/></svg>`;
  $('#boardcss').textContent=`cg-board{background-color:${l};background-image:url("data:image/svg+xml,${encodeURIComponent(svg)}")}`}
function askPromo(color){return new Promise(res=>{const el=$('#promo');
  el.innerHTML='<div class="pbox">'+[['queen','q'],['rook','r'],['bishop','b'],['knight','n']].map(([r,l])=>`<button data-p="${l}"><piece class="${r} ${color}"></piece></button>`).join('')+'</div>';
  el.classList.add('show');el.onclick=e=>{const b=e.target.closest('[data-p]');el.classList.remove('show');res(b?b.dataset.p:null)}})}

/* ---------- tree model ---------- */
function blank(white,undo){S={white,flip:false,limit:-Infinity,stay:false,focus:START,path:[START],nodes:new Map(),undo:undo||[]};node(START_FEN)}
function node(fen){const k=key(fen);if(!S.nodes.has(k))S.nodes.set(k,{k,fen,moves:[],prob:-Infinity,ignore:false});return S.nodes.get(k)}
const cur=()=>S.nodes.get(S.path.at(-1));
const userTurn=n=>(n.fen.split(' ')[1]==='w')===S.white;
const over=n=>new Chess(n.fen).game_over();
function fixCastle(n,u){const t={e1h1:'e1g1',e1a1:'e1c1',e8h8:'e8g8',e8a8:'e8c8'}[u];
  return t&&new Chess(n.fen).get(u.slice(0,2))?.type==='k'?t:u}
function buildOpp(n){ // all legal moves of an opponent position, probability (games+1)/(N+L) from the stored Lichess counts
  const c=new Chess(n.fen),ls=c.moves({verbose:true}),uc=m=>m.from+m.to+(m.promotion||'');
  n.N=ls.reduce((a,m)=>a+(n.g[uc(m)]||0),0);n.moves=[];
  for(const m of ls){const u=uc(m);c.move({from:m.from,to:m.to,promotion:m.promotion});const f=c.fen();c.undo();
    n.moves.push({uci:u,san:m.san,to:node(f).k,p:Math.log2(((n.g[u]||0)+1)/(n.N+ls.length))})}
  n.moves.sort((a,b)=>b.p-a.p)}
function addMove(n,uci,p){uci=fixCastle(n,uci);
  const ex=n.moves.find(m=>m.uci===uci);if(ex)return ex;
  const c=new Chess(n.fen),r=c.move({from:uci.slice(0,2),to:uci.slice(2,4),promotion:uci[4]});
  if(!r)throw Error('Illegal move '+uci);
  const m={uci,san:r.san,to:node(c.fen()).k,p};n.moves.push(m);return m}
const lse=(a,b)=>a===-Infinity?b:b===-Infinity?a:Math.max(a,b)+Math.log2(1+2**-Math.abs(a-b));
function recompute(){ // total probability of reaching each position (summed over transpositions); repetition loops are ignored
  const N=S.nodes,order=[],seen=new Set(),st=new Set(),back=new Set();
  (function d(k){seen.add(k);st.add(k);for(const m of N.get(k).moves){if(st.has(m.to))back.add(m);else if(!seen.has(m.to))d(m.to)}st.delete(k);order.push(k)})(START);
  for(const n of N.values()){n.prob=-Infinity;n.bv=-Infinity;n.par=null}
  N.get(START).prob=0;
  for(const k of order.reverse()){const n=N.get(k);for(const m of n.moves){if(back.has(m))continue;
    const t=N.get(m.to),v=n.prob+m.p;t.prob=lse(t.prob,v);if(v>t.bv){t.bv=v;t.par=k}}}}
function pathTo(k){const p=[k];while(p[0]!==START&&S.nodes.get(p[0]).par)p.unshift(S.nodes.get(p[0]).par);return p}
function nextLine(){ // best unfinished line inside the focus; returns the full route (through the focus root)
  let best=null;const from=new Map(),seen=new Set();
  (function w(k){if(seen.has(k))return;seen.add(k);const n=S.nodes.get(k);if(n.ignore)return;
    if(!n.moves.length){if(n.prob>=S.limit&&(!best||n.prob>best.prob)&&!over(n))best=n;return}
    for(const m of n.moves){if(m.to!==S.focus&&!from.has(m.to))from.set(m.to,k);w(m.to)}})(S.focus);
  if(!best)return null;
  const rt=[best.k];while(rt[0]!==S.focus)rt.unshift(from.get(rt[0]));
  const i=S.path.indexOf(S.focus);return[...(i>=0?S.path.slice(0,i+1):pathTo(S.focus)),...rt.slice(1)]}
async function fetchOpp(n){
  const u=`https://explorer.lichess.ovh/lichess?speeds=${cfg.speeds}&ratings=${cfg.ratings}&moves=99&fen=${encodeURIComponent(n.fen)}`;
  const r=await fetch(u,{headers:cfg.token?{Authorization:'Bearer '+cfg.token}:{}});
  if(!r.ok){if(r.status===401&&cfg.token){cfg.token='';ls('cfg',JSON.stringify(cfg))}
    throw Error('Lichess API error '+r.status+(r.status===401?' – please log in with Lichess (top right)':''))}
  const d=await r.json(),g={};
  for(const x of d.moves||[]){const u=fixCastle(n,x.uci);g[u]=(g[u]||0)+x.white+x.draws+x.black}
  n.g=g;n.exp=true;buildOpp(n)}
async function enter(p){ // go to a position; if the opponent is to move there, fetch Lichess data and auto-play the most common database reply
  S.path=p;const n=cur();
  if(!userTurn(n)&&!over(n)&&!n.exp){await fetchOpp(n);recompute();
    const m=n.N>0?n.moves[0]:null;if(m&&n.prob+m.p>=S.limit)S.path=[...p,m.to]}
  if(S.stay)S.focus=S.path.at(-1)}
async function userMove(uci){const n=cur();
  if(!userTurn(n)&&!n.exp)await fetchOpp(n);
  const m=n.moves.find(x=>x.uci===uci)||(userTurn(n)?addMove(n,uci,0):null);
  if(!m)throw Error('Illegal move');recompute();await enter([...S.path,m.to])}

/* ---------- save / load ---------- */
const ser=()=>{const opp=[],user=[];
  for(const n of S.nodes.values()){if(n.exp)opp.push([n.k,n.g]);else if(userTurn(n)&&n.moves.length)user.push([n.k,n.moves.map(m=>m.uci)])}
  return{v:3,white:S.white,limit:isFinite(S.limit)?S.limit:null,stay:S.stay,focus:S.focus,path:S.path,opp,user,
    ignored:[...S.nodes.values()].filter(n=>n.ignore).map(n=>n.k)}};
function load(o){if(o.v!==3)throw Error('This tree was saved by an older version and cannot be loaded.');
  blank(o.white,S?S.undo:[]);S.limit=o.limit==null?-Infinity:o.limit;S.stay=!!o.stay;
  const om=new Map(o.opp),um=new Map(o.user),seen=new Set(),q=[START];
  while(q.length){const k=q.shift();if(seen.has(k))continue;seen.add(k);const n=S.nodes.get(k);
    if(om.has(k)){n.g=om.get(k);n.exp=true;buildOpp(n)}else if(um.has(k))um.get(k).forEach(u=>addMove(n,u,0));
    for(const m of n.moves)if(!seen.has(m.to)&&(om.has(m.to)||um.has(m.to)))q.push(m.to)}
  (o.ignored||[]).forEach(k=>{if(S.nodes.has(k))S.nodes.get(k).ignore=true});recompute();
  if(o.path?.every(k=>S.nodes.has(k)))S.path=o.path;if(S.nodes.has(o.focus))S.focus=o.focus}
const slot=w=>w?'tree-white':'tree-black';
const persist=()=>{ls(slot(S.white),JSON.stringify(ser()));ls('colour',S.white?'w':'b')};
async function setColour(w){if(busy||S.white===w)return;persist();
  const t=ls(slot(w));try{t?load(JSON.parse(t)):blank(w);if(S.white!==w)blank(w)}catch{blank(w)}
  S.undo=[];const r=cur();
  if(cfg.token&&S.path.length===1&&!r.moves.length&&!userTurn(r))await act(async()=>{await enter([START])});
  else{render();persist()}}

/* ---------- actions ---------- */
async function act(fn){if(busy)return;busy=true;const s=JSON.stringify(ser());
  try{await fn();S.undo.push(s);if(S.undo.length>30)S.undo.shift()}
  catch(e){load(JSON.parse(s));toast(e.message)}
  busy=false;recompute();render();persist()}
async function nav(fn){if(busy)return;busy=true;const p0=S.path,f0=S.focus;
  try{await fn();if(S.stay)S.focus=S.path.at(-1)}catch(e){S.path=p0;S.focus=f0;toast(e.message)}
  busy=false;recompute();render();persist()}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',5000)}
const A={
  colW:()=>setColour(true),
  colB:()=>setColour(false),
  reset:()=>act(async()=>{if(!confirm('Erase your '+(S.white?'White':'Black')+' tree and start again?'))throw Error('Cancelled');
    blank(S.white,S.undo);await enter([START])}),
  load:()=>$('#file').click(),
  auth:()=>cfg.token?logout():login(),
  save(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(ser())],{type:'application/json'}));a.download=(S.white?'white':'black')+'-opening-tree.json';a.click()},
  next:()=>nav(async()=>{const r=nextLine();if(!r)throw Error('No unfinished lines left (check focus and limit).');await enter(r)}),
  back:()=>nav(async()=>{if(S.path.length>1)S.path=S.path.slice(0,-1)}),
  fwd:()=>nav(async()=>{const n=cur();
    if(!userTurn(n)&&!over(n)){if(!n.exp)return enter(S.path);if(!n.N)throw Error("No Lichess games here – choose the opponent's move yourself.")}
    let b=null;for(const m of n.moves){const t=S.nodes.get(m.to);if(!t.ignore&&(!b||t.prob>b.t.prob))b={m,t}}
    if(!b)throw Error('No further moves in the tree.');await enter([...S.path,b.m.to])}),
  root:()=>nav(async()=>{const i=S.path.indexOf(S.focus);S.path=i>=0?S.path.slice(0,i+1):pathTo(S.focus)}),
  undo(){const s=S.undo.pop();if(!s)return toast('Nothing to undo');load(JSON.parse(s));render();persist()},
  reviveall:()=>act(async()=>{subtree(cur().k).forEach(x=>x.ignore=false)}),
  focus:()=>act(async()=>{S.focus=cur().k}),
  unfocus:()=>act(async()=>{S.focus=START}),
  prune:()=>act(async()=>{const n=cur();if(n.k===START)throw Error('Cannot prune the starting position.');
    n.ignore=!n.ignore;if(n.ignore){S.path=S.path.slice(0,-1);if(S.focus===n.k)S.focus=S.path.at(-1)}}),
  stay:()=>act(async()=>{S.stay=!S.stay}),
  flip(){S.flip=!S.flip;render()},
  del:()=>act(async()=>{const n=cur(),mine=userTurn(n);
    if(S.path.length<2)throw Error('Cannot delete the starting position.');
    if(mine&&!n.moves.length)throw Error('There are no moves of yours below this position.');
    if(!confirm(mine?'Delete the moves you chose from this position, and everything below them?':'Delete this position (your move leading here) and everything below it?'))throw Error('Cancelled');
    if(mine)n.moves=[];else for(const o of S.nodes.values())if(userTurn(o))o.moves=o.moves.filter(m=>m.to!==n.k);
    const reach=new Set();(function w(k){if(reach.has(k))return;reach.add(k);S.nodes.get(k).moves.forEach(m=>w(m.to))})(START);
    for(const k of [...S.nodes.keys()])if(!reach.has(k))S.nodes.delete(k);
    if(!mine)S.path=S.path.slice(0,-1);while(!S.nodes.has(S.path.at(-1)))S.path.pop();
    if(!S.nodes.has(S.focus))S.focus=START})};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a]();
  const r=e.target.closest('[data-mv]');if(r)act(async()=>userMove(r.dataset.mv))});
document.addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey||!S||$('#promo').classList.contains('show')||document.documentElement.classList.contains('out'))return;
  const k={ArrowLeft:'back',ArrowRight:'fwd',ArrowUp:'root',n:'next',N:'next',f:'flip',F:'flip'}[e.key];if(k){e.preventDefault();A[k]()}});
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;e.target.value='';
  try{const t=JSON.parse((await f.text()).replace(/-Infinity/g,'null'));
    if(!!t.white!==S.white)await setColour(!!t.white);
    if(S.nodes.size>1&&!confirm('Replace your current '+(S.white?'White':'Black')+' tree with this file?'))return;
    act(async()=>{load(t)})}
  catch(err){toast('Could not load file: '+err.message)}};
const cg=Chessground($('#board'),{coordinates:false,animation:{duration:200},highlight:{lastMove:true,check:true},
  draggable:{showGhost:true},premovable:{enabled:false},movable:{free:false,showDests:true,events:{after:async(from,to)=>{
    const ms=new Chess(cur().fen).moves({verbose:true}).filter(x=>x.from===from&&x.to===to);
    if(busy||!ms.length)return render();
    let pr='';if(ms[0].flags.includes('p')){pr=await askPromo(ms[0].color==='w'?'white':'black');if(!pr)return render()}
    act(()=>userMove(from+to+pr))}}}});

/* ---------- rendering ---------- */
const pct=lp=>{const v=2**lp*100;return(v>=1?v.toFixed(1):v.toFixed(3))+'%'};
function subtree(k){const seen=new Set(),out=[];(function w(k){if(seen.has(k))return;seen.add(k);const x=S.nodes.get(k);out.push(x);x.moves.forEach(m=>w(m.to))})(k);return out}
function sanOf(path){let t='';path.slice(1).forEach((k,i)=>{const m=S.nodes.get(path[i]).moves.find(m=>m.to===k);if(m)t+=(i%2===0?`${i/2+1}. `:'')+m.san+' '});return t.trim()}
function render(){
  document.documentElement.classList.toggle('out',!cfg.token);$('#promo').classList.remove('show');
  const n=cur(),c=new Chess(n.fen),bw=S.flip?!S.white:S.white;
  let last=null;if(S.path.length>1){const m=S.nodes.get(S.path.at(-2)).moves.find(m=>m.to===n.k);if(m)last=[m.uci.slice(0,2),m.uci.slice(2,4)]}
  const col=c.turn()==='w'?'white':'black',dests=new Map();
  c.moves({verbose:true}).forEach(m=>{if(!dests.has(m.from))dests.set(m.from,[]);dests.get(m.from).push(m.to)});
  cg.set({fen:n.fen.split(' ')[0],orientation:bw?'white':'black',turnColor:col,check:c.in_check()?col:false,lastMove:last||null,
    movable:{color:col,dests}});
  const fl=bw?[0,1,2,3,4,5,6,7]:[7,6,5,4,3,2,1,0],rf=bw?7:0,br=bw?1:8; // square is dark when file index + rank is odd
  $('#ranks').innerHTML=(bw?[8,7,6,5,4,3,2,1]:[1,2,3,4,5,6,7,8]).map(r=>`<span class="${(rf+r)%2?'d':'l'}">${r}</span>`).join('');
  $('#files').innerHTML=fl.map(f=>`<span class="${(f+br)%2?'d':'l'}">${'abcdefgh'[f]}</span>`).join('');
  $('#pathline').textContent=sanOf(S.path)||'Starting position';
  const end=c.in_checkmate()?'Checkmate.':c.in_stalemate()?'Stalemate.':c.in_draw()?'Draw.':'';
  $('#info').innerHTML=`<b>${userTurn(n)?'Your move':"Opponent's move"}</b> ${end}<br>
   <span class="mut">${pct(n.prob)} of games reach this position (log₂ ${n.prob.toFixed(2)})</span><br>
   <span class="mut">${S.nodes.size} positions · ${S.focus===START?'no focus':'focus: '+(sanOf(pathTo(S.focus))||'start')}${n.ignore?' · <b>pruned</b>':''}</span>`;
  $('#btns').innerHTML=[['next','Next line (n)'],['back','◀ Back'],['fwd','Forward ▶'],['root','Focus root ▲'],['undo','Undo'],
    ...(S.focus!==n.k?[['focus','Focus here']]:[]),...(S.focus!==START?[['unfocus','Unfocus']]:[]),
    ['prune',n.ignore?'Revive branch':'Prune branch'],...(subtree(n.k).some(x=>x.ignore)?[['reviveall','Revive entire subtree']]:[]),['del','Delete'],['stay','Stay with line'+(S.stay?' ✓':'')]]
    .map(([a,t])=>`<button data-a="${a}"${a==='stay'&&S.stay?' class="on"':''}>${t}</button>`).join('')+
    `<label class="mut" style="margin-top:6px">Limit (log₂, e.g. −5 ≈ 1 in 32 games)
     <input id="lim" type="number" max="-1" step="1" style="width:5em" value="${isFinite(S.limit)?S.limit:''}" placeholder="none"></label>`;
  $('#lim').onchange=e=>{const v=e.target.value;act(async()=>{if(v==='')S.limit=-Infinity;else if(+v<0)S.limit=+v;else throw Error('Limit must be negative')})};
  const rows=n.moves.map(m=>{const t=S.nodes.get(m.to),w=userTurn(n)?0:Math.round(2**m.p*100);
    return`<tr data-mv="${m.uci}"><td><b>${m.san}</b>${t.ignore?' ✂':''}</td><td style="background:linear-gradient(90deg,rgba(98,153,36,.5) ${w}%,transparent ${w}%)">${userTurn(n)?'—':pct(m.p)}</td><td>${pct(t.prob)}</td></tr>`}).join('');
  $('#moves').innerHTML=(!userTurn(n)&&n.exp&&!n.N?'<p class="mut" style="margin:0 0 8px">No Lichess games here (with the current filters), so all legal moves are equally likely.</p>':'')
    +(rows?`<table><tr><th>Move</th><th>Opp. share</th><th>Reach</th></tr>${rows}</table>`
    :`<span class="mut">${userTurn(n)?'No moves yet — play one on the board.':'No moves available.'}</span>`);
  $('#auth').textContent=cfg.token?'Log out of Lichess':'Log in with Lichess';
  $('#colW').className=S.white?'on':'';$('#colB').className=S.white?'':'on';
  $('#settings').innerHTML=`<p class="mut">Press F to flip the board.</p><p><button data-a="reset">Reset ${S.white?'White':'Black'} tree…</button></p><p>Speeds:<br>${ALL_S.map(s=>`<label><input type="checkbox" data-cs="${s}"${cfg.speeds.includes(s)?' checked':''}> ${s}</label>`).join('')}</p>
   <p>Ratings:<br>${ALL_R.map(s=>`<label><input type="checkbox" data-cr="${s}"${cfg.ratings.includes(s)?' checked':''}> ${s}</label>`).join('')}</p>`;
  document.querySelectorAll('[data-cs],[data-cr]').forEach(i=>i.onchange=()=>{
    cfg.speeds=[...document.querySelectorAll('[data-cs]:checked')].map(x=>x.dataset.cs);
    cfg.ratings=[...document.querySelectorAll('[data-cr]:checked')].map(x=>x.dataset.cr);ls('cfg',JSON.stringify(cfg))})}

/* ---------- Lichess login (OAuth2 PKCE, no client secret) ---------- */
const CLIENT_ID='chess-opening-helper',REDIR=location.origin+location.pathname;
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function login(){
  const v=b64(crypto.getRandomValues(new Uint8Array(32))),st=b64(crypto.getRandomValues(new Uint8Array(16)));
  ls('pkce',v+'|'+st);
  location.href='https://lichess.org/oauth?'+new URLSearchParams({response_type:'code',client_id:CLIENT_ID,redirect_uri:REDIR,
    code_challenge_method:'S256',code_challenge:b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v))),state:st})}
async function finishLogin(){
  const q=new URLSearchParams(location.search),code=q.get('code');if(!code)return;
  $('#gate-msg').textContent='Logging in…';
  history.replaceState(null,'',REDIR);const [v,st]=(ls('pkce')||'|').split('|');ls('pkce','');
  try{if(!v||q.get('state')!==st)throw Error('state mismatch');
    const r=await fetch('https://lichess.org/api/token',{method:'POST',body:new URLSearchParams({grant_type:'authorization_code',
      code,code_verifier:v,redirect_uri:REDIR,client_id:CLIENT_ID})});
    const d=await r.json();if(!r.ok||!d.access_token)throw Error(d.error_description||d.error||r.status);
    cfg.token=d.access_token;ls('cfg',JSON.stringify(cfg))}
  catch(e){toast('Lichess login failed: '+e.message)}
  $('#gate-msg').textContent='The opening explorer needs a free Lichess account, so please log in to continue. No special permissions are requested.';
  act(async()=>{if(cfg.token&&S.path.length===1)await enter([START])})}
async function logout(){const t=cfg.token;cfg.token='';ls('cfg',JSON.stringify(cfg));render();
  try{await fetch('https://lichess.org/api/token',{method:'DELETE',headers:{Authorization:'Bearer '+t}})}catch{}}

/* ---------- start ---------- */
let w0=ls('colour')!=='b';
try{const t=ls(slot(w0));if(t)load(JSON.parse(t));else blank(w0)}catch{blank(w0)}
applyTheme();finishLogin();
act(async()=>{if(cfg.token&&S.path.length===1)await enter([START])});
</script></body></html>
