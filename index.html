<script type="module">
import {Chessground} from 'https://cdn.jsdelivr.net/npm/chessground@9/+esm';
const START_FEN='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const key=f=>f.split(' ').slice(0,3).join(' ');
const START=key(START_FEN);
const ALL_S=['ultraBullet','bullet','blitz','rapid','classical','correspondence'];
const ALL_R=['0','1000','1200','1400','1600','1800','2000','2200','2500'];
const $=s=>document.querySelector(s);
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch{return null}};
let cfg={token:'',speeds:['bullet','blitz','rapid','classical','correspondence'],ratings:['2200','2500']};
try{Object.assign(cfg,JSON.parse(ls('cfg')||'{}'))}catch{}
cfg.ev=Object.assign({on:false,engine:'lite1',threads:0,hash:128,lines:3},cfg.ev);
let S=null,busy=false,mode='b';const B={path:[START]},P={phase:'none',id:0,failed:false,msg:'',note:'',wrongs:0,reveal:'',pending:new Set()};
function applyTheme(){const l='#ecdab9',d='#ae8a68';let q='';
  for(let r=0;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2)q+=`M${c} ${r}h1v1h-1z`;
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><path fill='${d}' d='${q}'/></svg>`;
  $('#boardcss').textContent=`cg-board{background-color:${l};background-image:url("data:image/svg+xml,${encodeURIComponent(svg)}")}`}
function askPromo(color){return new Promise(res=>{const el=$('#promo');
  el.innerHTML='<div class="pbox">'+[['queen','q'],['rook','r'],['bishop','b'],['knight','n']].map(([r,l])=>`<button data-p="${l}"><piece class="${r} ${color}"></piece></button>`).join('')+'</div>';
  el.classList.add('show');el.onclick=e=>{const b=e.target.closest('[data-p]');el.classList.remove('show');res(b?b.dataset.p:null)}})}

/* ---------- tree model ---------- */
function blank(white,undo){S={white,flip:false,limit:-Infinity,limit2:null,anchor:null,stay:false,focus:START,path:[START],nodes:new Map(),undo:undo||[],plimit:-Infinity};node(START_FEN);recompute()}
function node(fen){const k=key(fen);if(!S.nodes.has(k))S.nodes.set(k,{k,fen,moves:[],prob:-Infinity,ignore:false});return S.nodes.get(k)}
const cur=()=>S.nodes.get(S.path.at(-1));
const userTurn=n=>(n.fen.split(' ')[1]==='w')===S.white;
const over=n=>new Chess(n.fen).game_over();
function fixCastle(n,u){const t={e1h1:'e1g1',e1a1:'e1c1',e8h8:'e8g8',e8a8:'e8c8'}[u];
  return t&&new Chess(n.fen).get(u.slice(0,2))?.type==='k'?t:u}
function buildOpp(n){ // all legal moves of an opponent position, probability (games+1)/(N+L) from the stored Lichess counts
  const c=new Chess(n.fen),ls=c.moves({verbose:true}),uc=m=>m.from+m.to+(m.promotion||'');
  n.N=ls.reduce((a,m)=>a+(n.g[uc(m)]||0),0);n.moves=[];
  for(const m of ls){const u=uc(m);c.move({from:m.from,to:m.to,promotion:m.promotion});const f=c.fen();c.undo();
    const ch=node(f);if(m.san.endsWith('#'))ch.mate=true;
    n.moves.push({uci:u,san:m.san,to:ch.k,p:Math.log2(((n.g[u]||0)+1)/(n.N+ls.length))})}
  n.moves.sort((a,b)=>b.p-a.p)}
function addMove(n,uci,p){uci=fixCastle(n,uci);
  const ex=n.moves.find(m=>m.uci===uci);if(ex)return ex;
  const c=new Chess(n.fen),r=c.move({from:uci.slice(0,2),to:uci.slice(2,4),promotion:uci[4]});
  if(!r)throw Error('Illegal move '+uci);
  const ch=node(c.fen());if(r.san.endsWith('#'))ch.mate=true;const m={uci,san:r.san,to:ch.k,p};n.moves.push(m);return m}
const lse=(a,b)=>a===-Infinity?b:b===-Infinity?a:Math.max(a,b)+Math.log2(1+2**-Math.abs(a-b));
function recompute(){ // total probability of reaching each position (summed over transpositions); repetition loops are ignored
  const N=S.nodes,order=[],seen=new Set(),st=new Set(),back=new Set();
  (function d(k){seen.add(k);st.add(k);for(const m of N.get(k).moves){if(st.has(m.to))back.add(m);else if(!seen.has(m.to))d(m.to)}st.delete(k);order.push(k)})(START);
  for(const n of N.values()){n.prob=-Infinity;n.bv=-Infinity;n.par=null}
  S.post=[...order];S.back=back;S.pi=new Map(order.map((k,i)=>[k,i]));S.parents=new Map();
  N.get(START).prob=0;
  for(const k of order.reverse()){const n=N.get(k);for(const m of n.moves){if(back.has(m))continue;(S.parents.get(m.to)||S.parents.set(m.to,[]).get(m.to)).push(k);
    const t=N.get(m.to),v=n.prob+m.p;t.prob=lse(t.prob,v);if(v>t.bv){t.bv=v;t.par=k}}}}
function pathTo(k){const p=[k];while(p[0]!==START&&S.nodes.get(p[0]).par)p.unshift(S.nodes.get(p[0]).par);return p}
function bestUnder(root,limit){ // best unfinished line below root (skipping pruned positions and positions below the limit); returns the route from root
  let best=null;const from=new Map(),seen=new Set();
  (function w(k){if(seen.has(k))return;seen.add(k);const n=S.nodes.get(k);if(n.ignore)return;
    if(!n.moves.length){if(n.prob>=limit&&(!best||n.prob>best.prob)&&!over(n))best=n;return}
    for(const m of n.moves){if(m.to!==root&&!from.has(m.to))from.set(m.to,k);w(m.to)}})(root);
  if(!best)return null;const rt=[best.k];while(rt[0]!==root)rt.unshift(from.get(rt[0]));return rt}
function nextLine(){ // returns the full route to the next unfinished line inside the focus
  const base=k=>{const i=S.path.indexOf(k);return i>=0?S.path.slice(0,i+1):pathTo(k)};
  if(S.stay){ // depth-first: keep working below where the current line started, down to the continue limit; then start a new line
    const lim2=S.limit2??S.limit;
    if(S.anchor&&S.nodes.has(S.anchor)&&subtree(S.focus).some(x=>x.k===S.anchor)){

  EV.bw=bw;const want=cfg.ev.on&&mode==='b';document.documentElement.classList.toggle('ev',want);
  if(!want){if(EV.fen!==null){EV.fen=null;EV.cur++;clearTimeout(EV.timer);EV.cloud=EV.local=null;EV.loading=false;engineStop()}}
  else if(fen!==EV.fen){
    EV.fen=fen;const id=++EV.cur;EV.cloud=null;EV.local=null;EV.status='';EV.loading=false;engineStop();clearTimeout(EV.timer);
    if(new Chess(fen).game_over())EV.status='Game over.';else EV.timer=setTimeout(()=>runEval(fen,id),300)}
  drawEval()}
function scheduleDraw(){if(!EV.draw)EV.draw=setTimeout(()=>{EV.draw=0;drawEval()},120)}
const FIG={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘'},SHORT={lite1:'SF 19 lite',lite:'SF 19 lite',full1:'SF 19 94MB',full:'SF 19 94MB'};
const PLUS='<svg viewBox="0 0 24 24" width="18" height="18"><rect width="24" height="24" rx="4" fill="#3692e7"/><path d="M12 6v12M6 12h12" stroke="#fff" stroke-width="3"/></svg>';
function drawEval(){
  const top=$('#evtop'),lines=$('#evlines'),gw=$('#gw');if(!top)return;
  const on=cfg.ev.on&&mode==='b',L=EV.local&&EV.local.pvs.some(Boolean)?EV.local:null,C=EV.cloud;
  const useLocal=L&&(!C||L.depth>=C.depth),src=useLocal?L:C,pvs=src?(useLocal?L.pvs.filter(Boolean):C.pvs):[];
  const best=pvs[0],depth=src?(useLocal?L.depth:C.depth):0,run=EV.local&&EV.local.running;
  const plus=!on||EV.loading||run?'':(C||EV.local)?`<button class="deeper" data-a="evrun" title="Go deeper (no depth limit)">${PLUS}</button>`:'';
  top.innerHTML=`<div class="ceval"><button class="sw${cfg.ev.on?' on':''}" data-a="evtoggle" role="switch" aria-checked="${cfg.ev.on}" title="Engine on/off"></button>
    <span class="pearl">${on?(best?scoreText(best):'…'):'—'}</span>
    <div class="engine"><div>${SHORT[curEngine()]} <span class="tech">NNUE</span></div>
    <div class="info">${on?`${plus}${src?'Depth '+depth:EV.loading?'checking the cloud…':''}${src&&!useLocal?' <span class="cloudtag">CLOUD</span>':''}${run?' …':''}`:'in local browser'}</div></div>
    <button class="gear${EV.showSet?' on':''}" data-a="evgear" title="Engine settings">⚙︎</button></div>`;
  $('#evsetbody').hidden=!EV.showSet;
  $('#evbar span').style.width=(on&&src?(run&&!EV.local.unlimited?Math.min(100,100*L.depth/AUTO_DEPTH):100):0)+'%';
  const fen=EV.fen;
  lines.innerHTML=on?pvs.map((p,i)=>{if(p.sanFor!==p.moves){p.san=fen?pvSan(fen,p.moves):'';p.sanFor=p.moves}
      return`<div class="pvl${EV.wrap.has(i)?' wrap':''}" data-pv="${i}"><b>${scoreText(p)}</b><span class="mv">${p.san}</span></div>`}).join('')
    +(EV.progress!=null?`<div class="mut">Downloading the engine… ${Math.round(EV.progress*100)}%</div>`:'')+(EV.status?`<div class="mut">${EV.status}</div>`:''):'';
  let fill=50;if(on&&best)fill=best.kind==='mate'?(best.val>0?100:0):50+50*(2/(1+Math.exp(-0.00368208*best.val))-1);
  $('#gauge').style.setProperty('--p',(100-fill)+'%');$('#gauge').classList.toggle('rev',!EV.bw)}
document.addEventListener('click',e=>{const r=e.target.closest('[data-pv]');if(!r)return;const i=+r.dataset.pv;EV.wrap.has(i)?EV.wrap.delete(i):EV.wrap.add(i);drawEval()});
function saveEv(){ls('cfg',JSON.stringify(cfg));EV.fen=null;render()}
function drawEvalSettings(){
  const el=$('#evsetbody');if(!el)return;const iso=self.crossOriginIsolated,e=cfg.ev,multi=ENGINES[curEngine()][2],hi=HASHES.indexOf(e.hash),thr=e.threads||THR_REC;
  el.innerHTML=`<p><label>Engine <select id="evEng">${Object.entries(ENGINES).map(([k,[l,,m]])=>`<option value="${k}"${k===curEngine()?' selected':''}${m&&!iso?' disabled':''}>${l}</option>`).join('')}</select></label></p>
   ${iso?'':'<p class="mut">Multi-threaded engines need a cross-origin-isolated page (see vercel.json).</p>'}
   <p><label>Multiple lines <input id="evLines" type="range" min="1" max="5" value="${e.lines}"> <span id="evLinesV">${e.lines}</span></label></p>
   ${multi?`<p><label>Threads <input id="evThr" type="range" min="1" max="${THR_MAX}" value="${thr}"> <span id="evThrV">${thr}</span></label> <span class="mut">recommended ${THR_REC}, max ${THR_MAX}</span></p>`:''}
   <p><label>Memory <input id="evHash" type="range" min="0" max="${HASHES.length-1}" value="${hi<0?3:hi}"> <span id="evHashV">${e.hash}</span> MB</label></p>
   <p class="mut">The engine files live in the <code>engine/</code> folder of the repo.</p>`;
  $('#evEng').onchange=x=>{cfg.ev.engine=x.target.value;saveEv()};
  $('#evLines').oninput=x=>{$('#evLinesV').textContent=x.target.value};$('#evLines').onchange=x=>{cfg.ev.lines=+x.target.value;saveEv()};
  if(multi){$('#evThr').oninput=x=>{$('#evThrV').textContent=x.target.value};$('#evThr').onchange=x=>{cfg.ev.threads=+x.target.value;saveEv()}}
  $('#evHash').oninput=x=>{$('#evHashV').textContent=HASHES[x.target.value]};$('#evHash').onchange=x=>{cfg.ev.hash=HASHES[x.target.value];saveEv()}}
Object.assign(A,{
  evtoggle(){cfg.ev.on=!cfg.ev.on;ls('cfg',JSON.stringify(cfg));EV.fen=null;render()},
  evgear(){EV.showSet=!EV.showSet;drawEval()},
  evrun(){if(!EV.local?.running)localSearch(0)}});

/* ---------- practice mode ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const qOf=n=>n.moves.length?((n.r?.[1]||0)+1)/((n.r?.[0]||0)+(n.r?.[1]||0)+2):1; // chance of getting this position wrong: (wrong+1)/(attempts+2); 1 if you have no move stored
const wc=(n,m)=>S.back.has(m)?0:(S.nodes.get(m.to).M||0);
function calcM(n){ // M = total weight of the lines that run through n and end below it: reach × product of your wrong-chances along the line.
  // Only reads the stored M of n's children. Lines start at the focus position, so only the focus subtree has any weight.
  if(n.pign||n.mate||!S.inF.has(n.k))return 0;
  if(userTurn(n)){if(!n.moves.length)return 1; // unanswered position: a line ends here, wrong-chance 1
    let s=0;for(const m of n.moves)s+=wc(n,m);return qOf(n)*s/n.moves.length}
  let s=0;for(const m of n.moves)s+=2**m.p*wc(n,m);return s}
function buildM(){ // full pass, used when entering practice mode or after a bulk change
  S.inF=new Set();(function d(k){if(S.inF.has(k))return;S.inF.add(k);S.nodes.get(k).moves.forEach(m=>d(m.to))})(S.focus);
  for(const k of S.post){const n=S.nodes.get(k);n.M=calcM(n)}}
function flushM(){ // after a line: recompute the answered positions and their ancestors in one pass, children first
  if(!P.pending.size)return;const seen=new Set(P.pending),st=[...P.pending];
  while(st.length){const x=st.pop();for(const p of S.parents.get(x)||[])if(!seen.has(p)){seen.add(p);st.push(p)}}
  [...seen].sort((a,b)=>S.pi.get(a)-S.pi.get(b)).forEach(x=>{const n=S.nodes.get(x);n.M=calcM(n)});P.pending.clear()}
function pick(items){const t=items.reduce((a,x)=>a+x[0],0);if(!(t>0))return null;let r=Math.random()*t;
  for(const x of items){r-=x[0];if(r<0)return x[1]}return items.at(-1)[1]}
async function advance(id){ // play the opponent's moves until you must answer, or the line ends (always after an opponent move)
  for(;;){const n=cur();
    if(n.mate)return endLine('Well done – you’ve reached the end of the line: it finishes in checkmate!');
    if(userTurn(n)){
      if(!n.moves.length)return endLine('Well done – you’ve reached the end of your prepared line! You have no response recorded for this position yet: build one in Build mode, or ignore the position.');
      if(n.moves.every(m=>S.nodes.get(m.to).pign))return endLine('Well done – you’ve reached the end of the line! Everything beyond this point is ignored.'); // nothing left to practise from here
      P.phase='ask';P.wrongs=0;P.reveal='';P.failed=false;P.msg='';return render()}
    const m=pick(n.moves.map(m=>[2**m.p*wc(n,m),m])) // normal case: follow the weights
      ||pick(n.moves.filter(m=>!S.back.has(m)&&!S.nodes.get(m.to).pign).map(m=>[2**m.p,m])); // you left the planned line: play on naturally
    if(!m)return endLine(n.moves.length?'Well done – you’ve reached the end of the line! Everything beyond this point is ignored.':'Well done – you’ve reached the end of the line! There’s no opponent data stored beyond this position.');
    await sleep(450);if(id!==P.id)return;
    S.path=[...S.path,m.to];render();
    if(S.nodes.get(m.to).prob<S.plimit)return endLine('Well done – you’ve reached the end of the line! The next positions are below your practice limit.')}}
async function startLine(){P.id++;const id=P.id;flushM();P.msg='';P.note='';S.path=pathTo(S.focus);
  if(!(S.nodes.get(S.focus).M>0)){P.phase='none';return render()}
  P.phase='busy';render();await advance(id)}
function endLine(note){flushM();P.phase='wait';P.note=note;render()}
async function attempt(from,to){
  if(P.phase!=='ask')return render();
  const n=cur(),ms=new Chess(n.fen).moves({verbose:true}).filter(x=>x.from===from&&x.to===to);
  if(!ms.length)return render();
  let pr='';if(ms[0].flags.includes('p')){pr=await askPromo(ms[0].color==='w'?'white':'black');if(!pr)return render()}
  const uci=from+to+pr,m=n.moves.find(x=>x.uci===uci),id=P.id;n.r=n.r||[0,0];P.pending.add(n.k);
  if(!m){n.r[1]++;P.failed=true;P.wrongs++;
    P.msg='Wrong – try again.'+(P.wrongs>1?` (${P.wrongs} wrong attempts)`:'')+(P.reveal?` The move is ${P.reveal}.`:'');persist();return render()}
  if(!P.failed)n.r[0]++; // an answer that follows a failed attempt is not counted as correct
  P.failed=false;P.msg='';persist();
  S.path=[...S.path,m.to];P.phase='busy';render();await advance(id)}
function enterPractice(){B.path=S.path;mode='p';P.pending.clear();buildM();startLine()}
function leavePractice(){P.id++;flushM();mode='b';S.path=B.path;render()}
async function switchColour(w){const was=mode;if(was==='p'&&S.white===w)return;
  if(was==='p')leavePractice();await setColour(w);if(was==='p')enterPractice()}
Object.assign(A,{
  modeB:()=>{if(mode==='p')leavePractice()},
  modeP:()=>{if(mode==='b')enterPractice()},
  reveal(){if(P.phase!=='ask'||P.reveal)return;const n=cur();n.r=n.r||[0,0];n.r[1]++;P.failed=true;P.pending.add(n.k);
    P.reveal=n.moves.map(m=>m.san).join(' or ');P.msg='The move is '+P.reveal+'. Play it to continue.';persist();render()},
  pskip(){if(P.phase==='ask')startLine()},
  pignore(){if(P.phase!=='ask'&&P.phase!=='wait')return;const n=cur();
    if(n.k===S.focus)return toast('Cannot ignore the position you are practising from. Change the focus in Build mode.');n.pign=true;P.pending.add(n.k);persist();startLine()},
  pnext(){if(P.phase==='wait'||P.phase==='none')startLine()},
  pclear(){for(const n of S.nodes.values())n.pign=false;P.pending.clear();buildM();persist();startLine()},
  preset(){if(!confirm('Erase all practice results for this colour?'))return;
    for(const n of S.nodes.values())n.r=null;P.pending.clear();buildM();persist();startLine()}});
function renderPractice(){
  const ph=P.phase,ni=[...S.nodes.values()].filter(x=>x.pign).length;
  $('#prac').innerHTML=`<div class="tabbar"><span class="on">Practice · ${S.white?'White':'Black'}</span></div><p class="mut">${S.focus===START?'from the starting position':'from: '+(sanOf(pathTo(S.focus))||'start')}</p>
   ${ph==='none'?'<p>Nothing to practise yet. Build some lines in Build mode, or check your focus and ignored positions.</p>':''}
   ${ph==='busy'?'<p class="mut">…</p>':''}
   ${ph==='ask'?`<p><b>Your move.</b></p>${P.msg?`<p class="bad">${P.msg}</p>`:''}`:''}
   ${ph==='wait'?`<p class="good"><b>${P.note}</b></p>`:''}
   <div class="btns">${ph==='ask'?'<button data-a="reveal">Reveal move</button><button data-a="pskip">Skip line</button>':''}${ph==='wait'||ph==='none'?'<button data-a="pnext" class="on">Next line (Enter)</button>':''}${ph==='ask'||ph==='wait'?'<button data-a="pignore">Ignore this position</button>':''}</div>
   <div style="border-top:1px solid var(--bd);margin-top:12px;padding-top:10px">
   <label class="mut">Practice limit (log₂) <input id="plim" type="number" max="-1" step="1" style="width:5em" value="${isFinite(S.plimit)?S.plimit:''}" placeholder="none"></label>
   <div class="btns" style="margin-top:8px"><button data-a="pclear">Clear ignored (${ni})</button><button data-a="preset">Reset results</button></div>
   <p class="mut">Ignore and the practice limit only affect practice. Prune and the limit in Build mode are separate.</p></div>`;
  $('#plim').onchange=e=>{const v=e.target.value;if(v==='')S.plimit=-Infinity;else if(+v<0)S.plimit=+v;else toast('Limit must be negative');persist()}}

/* ---------- Lichess login (OAuth2 PKCE, no client secret) ---------- */
const CLIENT_ID='chess-opening-helper',REDIR=location.origin+location.pathname;
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function login(){
  const v=b64(crypto.getRandomValues(new Uint8Array(32))),st=b64(crypto.getRandomValues(new Uint8Array(16)));
  ls('pkce',v+'|'+st);
  location.href='https://lichess.org/oauth?'+new URLSearchParams({response_type:'code',client_id:CLIENT_ID,redirect_uri:REDIR,
    code_challenge_method:'S256',code_challenge:b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v))),state:st})}
async function finishLogin(){
  const q=new URLSearchParams(location.search),code=q.get('code');if(!code)return;
  $('#gate-msg').textContent='Logging in…';
  history.replaceState(null,'',REDIR);const [v,st]=(ls('pkce')||'|').split('|');ls('pkce','');
  try{if(!v||q.get('state')!==st)throw Error('state mismatch');
    const r=await fetch('https://lichess.org/api/token',{method:'POST',body:new URLSearchParams({grant_type:'authorization_code',
      code,code_verifier:v,redirect_uri:REDIR,client_id:CLIENT_ID})});
    const d=await r.json();if(!r.ok||!d.access_token)throw Error(d.error_description||d.error||r.status);
    cfg.token=d.access_token;ls('cfg',JSON.stringify(cfg))}
  catch(e){toast('Lichess login failed: '+e.message)}
  $('#gate-msg').textContent='The opening explorer needs a free Lichess account, so please log in to continue. No special permissions are requested.';
  act(async()=>{if(cfg.token&&S.path.length===1)await enter([START])})}
async function logout(){const t=cfg.token;cfg.token='';ls('cfg',JSON.stringify(cfg));render();
  try{await fetch('https://lichess.org/api/token',{method:'DELETE',headers:{Authorization:'Bearer '+t}})}catch{}}

/* ---------- start ---------- */
let w0=ls('colour')!=='b';
try{const t=ls(slot(w0));if(t)load(JSON.parse(t));else blank(w0)}catch{blank(w0)}
applyTheme();finishLogin();
act(async()=>{if(cfg.token&&S.path.length===1)await enter([START])});
</script></body></html>
